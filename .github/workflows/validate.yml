name: Validate AI add-on
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Home Assistant amd64 image
        run: docker build --build-arg BUILD_ARCH=amd64 -t eac-vision-ai ./eac_vision_ai
      - name: Load model and run one inference
        run: docker run --rm --entrypoint python3 eac-vision-ai -c "import sys,numpy as np;sys.path.insert(0,'/opt/eac');from ai import Detector;d=Detector('/opt/eac/ai/yolox_tiny.onnx');assert d.infer(np.zeros((360,640,3),dtype=np.uint8))==[];print(d.device)"
      - name: Decode a camera-like RTSP stream for AI
        run: docker run --rm --entrypoint python3 -e EAC_AI_APP_DIR=/opt/eac -v "$PWD/tests:/tests:ro" eac-vision-ai /tests/check_ai_stream.py
      - name: Detect a person in a sample video
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/person-video.avi" https://raw.githubusercontent.com/opencv/opencv/master/samples/data/vtest.avi
          docker run --rm --entrypoint python3 -e EAC_AI_APP_DIR=/opt/eac -v "$PWD/tests:/tests:ro" -v "$RUNNER_TEMP/person-video.avi:/sample.avi:ro" eac-vision-ai /tests/check_person_video.py /sample.avi
